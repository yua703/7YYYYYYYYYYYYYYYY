<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ExErcise 賽事即時戰況</title>
    <link rel="stylesheet" href="lb-style.css">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;700&family=Permanent+Marker&display=swap" rel="stylesheet">
</head>
<body>

    <div class="lb-container">
        <header class="lb-top-header">
            <h1 id="current-category-title">載入中...</h1>
            <div class="progress-bar-container">
                <div class="progress-bar" id="progress-bar"></div>
            </div>
        </header>

        <div class="lb-list-header">
            <span class="col-rank">排名</span>
            <span class="col-name">暱稱</span>
            <span class="col-number">編號</span>
            <span class="col-score">分數</span>
        </div>

        <div id="leaderboard-data" class="lb-list-body">
            </div>
    </div>
    <div class="qr-code-fixed-box">
        <div class="qr-img-wrapper">
            <img src="../img/qr.jpg" alt="掃描瀏覽官網">
        </div>
        <p class="qr-label">掃描瀏覽官網</p>
    </div>

    <script src="lb-script.js"></script>
</body>
</html>
