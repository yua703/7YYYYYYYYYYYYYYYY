<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>賽事主頁</title>

  <!-- 主網站 CSS -->
  <link rel="stylesheet" href="main.css">
</head>

<body>
  <h1>賽事主畫面</h1>

  <!-- 頁籤 -->
  <div id="tabs">
    <button class="active" data-target="intro">賽事介紹</button>
    <button data-target="leaderboard">排行榜</button>
  </div>

  <!-- 介紹內容 -->
  <div id="intro">
    <h2>組別介紹</h2>
    <p>這裡放賽事內容、規則、圖片等等...</p>
  </div>

  <!-- 排行榜 iframe（預設隱藏） -->
  <iframe
    id="leaderboard-frame"
    src="../leaderboard/leaderboard.html"
    style="display:none; width:100%; height:900px; border:none;">
  </iframe>

  <!-- 主網站 JS -->
  <script src="main.js"></script>
</body>
</html>
